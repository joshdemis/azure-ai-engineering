apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: retrieval-api
  template:
    metadata:
      labels:
        app: retrieval-api
    spec:
      containers:
        - name: retrieval-api
          image: acrai200dev.azurecr.io/retrieval-api:v2
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "0.5.0-aks"
